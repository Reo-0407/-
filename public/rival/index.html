<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RIVAL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1) 닉네임 화면 -->
  <section id="screen-nick" class="screen">
    <h1 class="logo">RIVAL</h1>
    <p class="sub">닉네임을 정하고 시작하세요</p>
    <input id="nick-input" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="off">
    <button id="nick-btn" class="btn">입장</button>
    <p id="nick-err" class="err"></p>
  </section>

  <!-- 2) 로비 -->
  <section id="screen-lobby" class="screen hidden">
    <div class="lobby">
      <div class="panel">
        <h1 class="logo small">RIVAL</h1>
        <p>안녕하세요, <b id="lobby-nick"></b>님</p>
        <button id="play-btn" class="btn">연습장 입장 (1단계: 이동 테스트)</button>
        <button id="nick-change" class="btn ghost">닉네임 변경</button>
        <p class="hint">PC: WASD 이동 · 마우스 시점 · Space 점프 · Shift 달리기 · Esc 나가기<br>모바일 조작은 8단계에서 추가돼요.</p>
      </div>
      <div class="panel">
        <h2>🏆 리더보드</h2>
        <table id="board"><thead><tr><th>#</th><th>닉네임</th><th>승</th><th>킬</th><th>데스</th></tr></thead><tbody></tbody></table>
        <p id="board-empty" class="hint hidden">아직 기록이 없어요. 첫 번째 주인공이 되세요!</p>
      </div>
    </div>
  </section>

  <!-- 3) 게임 -->
  <div id="game" class="hidden">
    <canvas id="c"></canvas>
    <div id="crosshair">+</div>
    <div id="click-to-play" class="hidden">클릭해서 시작 (Esc: 로비로)</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
